<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace - Student Authority</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body { font-family: 'Inter', sans-serif; background: #f8faff; color: #0f172a; overflow: hidden; }
    h1, h2, h3, h4, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    #portal-container { display: flex; height: 100vh; }
    
    /* SIDEBAR - OLD DESIGN */
    #sidebar { 
        width: 288px; 
        background: #ffffff; 
        display: flex; 
        flex-direction: column; 
        padding: 2rem 1rem; 
        border-right: 1px solid rgba(139, 92, 246, 0.2);
        z-index: 50;
    }
    
    #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #content-frame { width: 100%; height: 100%; border: none; }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        color: #64748b;
        font-weight: 600;
        font-size: 0.875rem;
        transition: all 0.2s;
        cursor: pointer;
        margin-bottom: 0.25rem;
    }
    .nav-item:hover { background: #f1f5f9; color: #7c3aed; }
    .nav-item.active { 
        background: rgba(124, 58, 237, 0.1); 
        color: #7c3aed; 
        border-right: 4px solid #7c3aed;
        border-radius: 0.75rem 0 0 0.75rem;
    }

    /* Header */
    #header {
        height: 64px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        display: flex;
        align-items: center;
        padding: 0 2rem;
        justify-content: space-between;
    }

    .dark body { background-color: #000000; color: #f8fafc; }
    .dark #sidebar { background-color: #000000; border-right-color: rgba(139, 92, 246, 0.2); }
    .dark .nav-item:hover { background: rgba(255,255,255,0.05); }
    .dark #header { background-color: rgba(0, 0, 0, 0.8); border-bottom-color: rgba(139, 92, 246, 0.2); }
</style>
</head>

<body>

<div id="portal-container">
    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="px-4 mb-10">
            <div class="flex items-center gap-3">
                <img src="logo.png" class="w-8 h-8 object-contain" alt="Junospace Logo" />
                <h1 class="text-xl font-bold text-violet-700 tracking-tighter">Junospace</h1>
            </div>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.2em] mt-1">Command Center</p>
        </div>

        <nav class="flex-1">
            <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </div>
            <div class="nav-item" data-page="courses" onclick="navigate('courses')">
                <span class="material-symbols-outlined">school</span> My Courses
            </div>
            <div class="nav-item" data-page="leaderboard" onclick="navigate('leaderboard')">
                <span class="material-symbols-outlined">lightbulb</span> Innovation Board
            </div>
            <div class="nav-item" data-page="analytics" onclick="navigate('analytics')">
                <span class="material-symbols-outlined">analytics</span> Analytics
            </div>
            <div class="nav-item" data-page="profile" onclick="navigate('profile')">
                <span class="material-symbols-outlined">person</span> Profile
            </div>
        </nav>

        <div class="mt-auto border-t border-slate-100 pt-6 px-2">
            <div class="flex items-center gap-3 p-2">
                <div id="user-avatar" class="w-10 h-10 rounded-full bg-[#7c3aed] flex items-center justify-center text-white font-bold text-sm">
                    A
                </div>
                <div class="flex-1 min-w-0">
                    <p id="user-name" class="text-sm font-bold text-slate-800 truncate">Scholar</p>
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Lvl. 42 Architect</p>
                </div>
                <button onclick="doLogout()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <span class="material-symbols-outlined text-lg">logout</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <header id="header">
            <div class="flex items-center gap-4">
                <h2 id="page-title" class="text-lg font-bold text-slate-800">Student Dashboard</h2>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-[#7c3aed] transition-colors">
                    <span class="material-symbols-outlined">contrast</span>
                </button>
                <div class="w-8 h-8 rounded-full border-2 border-[#7c3aed] overflow-hidden">
                    <img id="header-avatar" src="logo.png" class="w-full h-full object-cover" alt="Avatar">
                </div>
            </div>
        </header>

        <iframe id="content-frame" src="student_dashboard_dark_mode/code.html"></iframe>
    </div>
</div>

<script src="./env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const { createClient } = supabase
    const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)

    function navigate(page) {
        const frame = document.getElementById('content-frame');
        const title = document.getElementById('page-title');
        
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelector(`[data-page="${page}"]`).classList.add('active');

        const pages = {
            dashboard: 'student_dashboard_dark_mode/code.html',
            courses: 'courses.html',
            leaderboard: 'global_leaderboard_2/code.html',
            analytics: 'analytics_page_dark_mode/code.html',
            profile: 'student_profile/code.html'
        };

        frame.src = pages[page];
        title.innerText = page.charAt(0).toUpperCase() + page.slice(1) + ' Dashboard';
    }

    function toggleTheme() {
        const theme = localStorage.getItem('junospace-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('junospace-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.getElementById('content-frame').contentWindow.postMessage({ action: 'themeUpdate' }, '*');
    }

    async function doLogout() {
        localStorage.removeItem('mock_user');
        window.location.href = 'index.html';
    }

    window.addEventListener('message', (e) => {
        if (e.data.action === 'navigate') {
            navigate(e.data.page);
        }
    });

    // Sync theme
    const theme = localStorage.getItem('junospace-theme') || 'light';
    document.documentElement.classList.toggle('dark', theme === 'dark');

    // Load User
    (async () => {
        const userStr = localStorage.getItem('mock_user');
        if (!userStr) { window.location.href = 'index.html'; return; }
        
        const profile = JSON.parse(userStr);
        if (profile) {
            document.getElementById('user-name').innerText = profile.full_name;
            document.getElementById('user-avatar').innerText = profile.avatar_initials || profile.full_name.charAt(0);
        }
    })();
</script>

</body>
</html>
