<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace - Celestial Roadmap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Theme Support */
    .dark body { background-color: #020617; color: #f8fafc; }
    .dark .bg-white { background-color: #0f172a !important; border-color: rgba(255,255,255,0.05) !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }
    .dark .text-slate-500 { color: #94a3b8 !important; }

    /* Roadmap Animations */
    #roadmap-path {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: path-draw 3s ease-out forwards;
    }
    @keyframes path-draw {
        to { stroke-dashoffset: 0; }
    }

    .node-pulse {
        animation: node-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes node-ping {
        75%, 100% { transform: scale(1.5); opacity: 0; }
    }

    .aura-particle {
        position: absolute;
        width: 4px; height: 4px;
        background: #6366f1;
        border-radius: full;
        offset-path: path("M200,50 Q280,150 200,250 T200,450 T200,650 T200,850 T200,1050");
        animation: particle-move 5s linear infinite;
    }
    @keyframes particle-move {
        to { offset-distance: 100%; }
    }
</style>

<script>
    function applyTheme() {
        const theme = localStorage.getItem('junospace-theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
    }
    window.addEventListener('storage', applyTheme);
    window.addEventListener('message', (e) => { if (e.data.action === 'themeUpdate') applyTheme(); });
    applyTheme();
</script>
</head>

<body class="bg-slate-50 selection:bg-violet-100 antialiased">

<main class="min-h-screen p-8 lg:p-12 relative overflow-hidden">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-20 max-w-6xl mx-auto relative z-20">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight leading-none">Celestial Roadmap</h2>
            <p class="text-slate-500 font-medium mt-3">Visualizing your trajectory through the technical stratosphere.</p>
        </div>
        <div class="flex items-center gap-4 bg-white p-3 rounded-[2rem] shadow-xl shadow-slate-200/40 border border-slate-100">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black">42%</div>
            <div>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Global Completion</p>
                <div class="w-32 h-1.5 bg-slate-100 rounded-full mt-1 overflow-hidden"><div class="h-full bg-indigo-500" style="width: 42%"></div></div>
            </div>
        </div>
    </header>

    <!-- Roadmap Canvas -->
    <div class="relative max-w-4xl mx-auto py-24 min-h-[1200px]">
        
        <!-- SVG Path -->
        <svg class="absolute top-0 left-0 w-full h-full pointer-events-none z-0 overflow-visible" viewBox="0 0 400 1200">
            <path id="roadmap-path" d="M200,50 Q280,150 200,250 T200,450 T200,650 T200,850 T200,1050" 
                  stroke="url(#pathGradient)" stroke-width="4" fill="none" stroke-linecap="round" />
            <defs>
                <linearGradient id="pathGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>

        <!-- Aura Particles -->
        <div class="aura-particle" style="animation-delay: 0s"></div>
        <div class="aura-particle" style="animation-delay: -2s"></div>

        <!-- Nodes Container -->
        <div id="nodes-container" class="space-y-48 w-full relative z-10 flex flex-col items-center">
             <!-- Injected by JS -->
             <div class="py-20 text-center bg-white/50 backdrop-blur-md rounded-[3rem] border border-dashed border-slate-200 w-full animate-pulse">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Synchronizing Spatial Nodes...</p>
             </div>
        </div>
    </div>
</main>

<!-- Modal -->
<div id="node-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-lg flex items-center justify-center p-6">
    <div class="bg-white rounded-[3rem] p-12 max-w-xl w-full shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-indigo-500"></div>
        <div id="modal-content" class="text-center">
            <div id="modal-icon" class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-[1.5rem] flex items-center justify-center mx-auto mb-8"><span class="material-symbols-outlined text-4xl">rocket_launch</span></div>
            <h3 id="modal-title" class="text-3xl font-black text-slate-800 mb-4">Node Title</h3>
            <p id="modal-desc" class="text-slate-500 font-medium leading-relaxed mb-10">Module description will appear here.</p>
            <button onclick="document.getElementById('node-modal').classList.add('hidden')" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-slate-900/20 hover:scale-105 active:scale-95 transition-all">Establish Link</button>
        </div>
    </div>
</div>

<script src="../env.js"></script>
<script src="../js/auth.js"></script>
<script>
  const db = window.db;
  
  async function loadRoadmap() {
    const { data: { user } } = await db.auth.getUser();
    const { data: enrolls } = await db.from('enrollments').select('batch_id').eq('student_id', user.id).eq('status', 'active');
    const batchId = enrolls?.[0]?.batch_id;

    if (!batchId) return;

    const { data: weeks } = await db.from('roadmap_weeks').select('*').eq('batch_id', batchId).order('week_number');
    const container = document.getElementById('nodes-container');

    container.innerHTML = weeks.map((w, i) => {
        const isCompleted = w.status === 'completed';
        const isActive = w.status === 'active';
        const isLocked = w.status === 'locked';
        const sideClass = i % 2 === 0 ? '-translate-x-24' : 'translate-x-24';
        
        return `
        <div class="flex justify-center ${sideClass}">
            <div onclick="showNode('${w.title}', '${w.description}')" class="relative group cursor-pointer">
                ${isActive ? '<div class="absolute -inset-8 bg-indigo-100 rounded-full blur-2xl opacity-40 node-pulse"></div>' : ''}
                <div class="relative w-36 h-36 rounded-[2.5rem] ${isCompleted ? 'bg-emerald-500 border-4 border-white text-white' : isActive ? 'bg-indigo-600 border-4 border-white text-white' : 'bg-white border-2 border-slate-100 text-slate-300'} flex flex-col items-center justify-center shadow-2xl transition-all group-hover:scale-110 active:scale-95">
                    <span class="material-symbols-outlined text-4xl">${isCompleted ? 'verified' : isActive ? 'rocket_launch' : 'lock'}</span>
                    <p class="text-[9px] font-black uppercase tracking-widest mt-2">${w.status}</p>
                    <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-48 text-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <p class="text-[10px] font-black text-slate-800 uppercase tracking-widest">${w.title}</p>
                    </div>
                </div>
            </div>
        </div>
        `;
    }).join('');
  }

  function showNode(title, desc) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-desc').innerText = desc;
    document.getElementById('node-modal').classList.remove('hidden');
  }

  loadRoadmap();
</script>

</body>
</html>
