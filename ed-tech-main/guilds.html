<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace - Collaborative Guilds</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Theme Support */
    .dark body { background-color: #020617; color: #f8fafc; }
    .dark .bg-white { background-color: #0f172a !important; border-color: rgba(255,255,255,0.05) !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }

    .guild-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .guild-card:hover {
        transform: translateY(-8px) scale(1.02);
    }
</style>

<script>
    function applyTheme() {
        const theme = localStorage.getItem('junospace-theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
    }
    window.addEventListener('storage', applyTheme);
    window.addEventListener('message', (e) => { if (e.data.action === 'themeUpdate') applyTheme(); });
    applyTheme();
</script>
</head>

<body class="bg-slate-50 antialiased selection:bg-indigo-100">

<main class="min-h-screen p-8 lg:p-12 space-y-12 max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-20">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight leading-none">Collaborative Guilds</h2>
            <p class="text-slate-500 font-medium mt-3">Join specialized technical interest groups to unlock collective mastery.</p>
        </div>
        <div id="membership-badge" class="hidden px-6 py-3 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center gap-3">
             <span class="material-symbols-outlined text-indigo-600">shield</span>
             <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Active Guild Member</span>
        </div>
    </header>

    <!-- Guild Grid -->
    <div id="guild-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
        <!-- Injected -->
        <div class="h-64 bg-white rounded-[3rem] animate-pulse"></div>
        <div class="h-64 bg-white rounded-[3rem] animate-pulse"></div>
    </div>
</main>

<script src="./env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase
  const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)
  
  async function loadGuilds() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) return;

    const [
      { data: guilds },
      { data: memberships }
    ] = await Promise.all([
      db.from('guilds').select('*'),
      db.from('guild_members').select('guild_id').eq('student_id', user.id)
    ]);

    const memberIds = new Set(memberships?.map(m => m.guild_id));
    if (memberIds.size > 0) document.getElementById('membership-badge').classList.remove('hidden');

    const grid = document.getElementById('guild-grid');
    grid.innerHTML = (guilds || []).map(g => {
        const isMember = memberIds.has(g.id);
        return `
        <div class="guild-card bg-white p-10 rounded-[3rem] border border-slate-100 shadow-xl shadow-slate-200/40 flex flex-col justify-between">
            <div>
               <div class="w-16 h-16 rounded-[1.5rem] flex items-center justify-center text-white shadow-lg mb-8" style="background-color: ${g.color}">
                  <span class="material-symbols-outlined text-3xl">${g.icon}</span>
               </div>
               <h3 class="text-2xl font-black text-slate-800 mb-3">${g.name}</h3>
               <p class="text-slate-500 font-medium leading-relaxed">${g.description}</p>
            </div>
            <div class="mt-10 flex items-center justify-between">
               <div class="flex -space-x-3">
                  ${[1,2,3,4].map(i => `<div class="w-10 h-10 rounded-full border-4 border-white bg-slate-200 shadow-sm flex items-center justify-center text-[10px] font-bold text-slate-400">?</div>`).join('')}
                  <div class="w-10 h-10 rounded-full border-4 border-white bg-slate-50 flex items-center justify-center text-[10px] font-black text-slate-400">+12</div>
               </div>
               ${isMember ? `
                  <button class="px-8 py-3 bg-slate-100 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-widest cursor-default">Joined</button>
               ` : `
                  <button onclick="joinGuild('${g.id}')" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-indigo-600/20 hover:scale-105 active:scale-95 transition-all">Establish Link</button>
               `}
            </div>
        </div>
        `;
    }).join('');
  }

  window.joinGuild = async (guildId) => {
    const { data: { user } } = await db.auth.getUser();
    const { error } = await db.from('guild_members').insert({ guild_id: guildId, student_id: user.id });
    if (!error) {
       loadGuilds();
    } else {
       alert(error.message);
    }
  };

  loadGuilds();
</script>

</body>
</html>
