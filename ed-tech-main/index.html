<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junospace | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8faff;
        }
        .lc-brand {
            background: linear-gradient(135deg, #a78bfa, #fbc2c3);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        .input-group {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .l-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .l-input:focus {
            background: #fff;
            border-color: #8b5cf6;
        }
        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            z-index: 100;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[1080px] grid lg:grid-cols-2 bg-white rounded-[2.5rem] overflow-hidden shadow-[0_20px_60px_rgba(53,37,205,0.12)]">
        
        <!-- Left Side: Brand -->
        <div class="lc-brand hidden lg:flex flex-col items-center justify-center p-12 relative overflow-hidden">
            <div class="relative w-64 h-64 flex items-center justify-center">
                <!-- Rotating Text SVG -->
                <svg viewBox="0 0 100 100" class="w-full h-full animate-spin-slow">
                    <defs>
                        <path id="circlePath" d="M 50, 50 m -38, 0 a 38,38 0 1,1 76,0 a 38,38 0 1,1 -76,0" />
                    </defs>
                    <text class="text-[7.5px] font-black fill-white uppercase tracking-[0.15em]">
                        <textPath xlink:href="#circlePath">
                            CREATE WHAT YOU USE • CREATE WHAT YOU USE • CREATE WHAT YOU USE •
                        </textPath>
                    </text>
                </svg>
                <!-- Logo -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <img src="logo.png" class="w-20 h-20 drop-shadow-2xl" alt="Logo">
                </div>
            </div>
            <h1 class="text-white text-5xl font-black mt-8 tracking-tighter">Junospace</h1>
        </div>

        <!-- Right Side: Form -->
        <div class="p-12 lg:p-20 flex flex-col justify-center">
            <div class="max-w-sm mx-auto w-full">
                <h2 class="text-3xl font-black text-slate-800 mb-2">Welcome Back</h2>
                <p class="text-slate-500 font-medium mb-10">Enter your credentials to access your dashboard.</p>

                <form id="login-form" class="space-y-6">
                    <div class="input-group">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input type="email" id="email" class="l-input" placeholder="Email" required>
                    </div>

                    <div class="input-group relative">
                        <div class="flex justify-between items-center mb-1 absolute right-0 -top-8">
                            <a href="#" class="text-xs font-bold text-violet-600 hover:underline">Forgot?</a>
                        </div>
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input type="password" id="password" class="l-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="w-full bg-[#7c3aed] text-white font-bold py-4 rounded-full shadow-[0_8px_24px_rgba(53,37,205,0.3)] hover:bg-[#8b5cf6] hover:-translate-y-0.5 transition-all active:scale-[0.97] flex items-center justify-center gap-2">
                        Sign In to Portal <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </form>

                <p class="text-center text-slate-400 text-xs font-medium mt-12">
                    Having trouble? <a href="#" class="text-violet-600 font-bold hover:underline">Contact your administrator.</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="./env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const form = document.getElementById('login-form');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Mock Authentication
            const mockUsers = [
                { email: 'student@atelier.com', password: 'student123', role: 'student', full_name: 'Alex Johnson', avatar_initials: 'AJ' },
                { email: 'sathish@atelier.com', password: 'password123', role: 'student', full_name: 'Sathish', avatar_initials: 'SA' },
                { email: 'sathish', password: 'password', role: 'student', full_name: 'Sathish', avatar_initials: 'SA' }
            ];

            const user = mockUsers.find(u => u.email === email && u.password === password);
            
            if (!user) {
                showToast('Invalid credentials. Use sathish / password');
                return;
            }

            if (user.role === 'student') {
                localStorage.setItem('mock_user', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                showToast('Access Denied. Student clearance required.');
            }
        };
    </script>
</body>
</html>
