<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace - Course Registry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body { font-family: 'Inter', sans-serif; font-weight: 400; overflow-x: hidden; }
    h1, h2, h3, h4, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Theme Support */
    .dark body { background-color: #020617; color: #f8fafc; }
    .dark .bg-white { background-color: #0f172a !important; border-color: rgba(255,255,255,0.05) !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }
    .dark .text-slate-500 { color: #94a3b8 !important; }
    .dark .bg-slate-50 { background-color: #020617 !important; }

    .course-card {
        opacity: 0;
        transform: translateY(20px);
        animation: card-reveal 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes card-reveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .pulse-glow {
        animation: pulse-glow 3s infinite;
    }
    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        50% { box-shadow: 0 0 20px 5px rgba(99, 102, 241, 0.2); }
    }
</style>

<script>
    function applyTheme() {
        const theme = localStorage.getItem('junospace-theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
    }
    window.addEventListener('storage', applyTheme);
    window.addEventListener('message', (e) => { if (e.data.action === 'themeUpdate') applyTheme(); });
    applyTheme();
</script>
</head>

<body class="bg-slate-50 text-slate-800 selection:bg-violet-200">

<main class="min-h-screen p-8 lg:p-12 space-y-12 max-w-[1600px] mx-auto">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-12">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight leading-none">Course Registry</h2>
            <p class="text-slate-500 font-medium mt-3">Architecting your path through the global knowledge network.</p>
        </div>
        <div class="flex items-center gap-4">
             <div class="flex items-center gap-3 mr-4">
                <img src="logo.png" class="w-8 h-8 object-contain" alt="Junospace Logo" />
                <h1 class="text-xl font-bold text-violet-700 tracking-tighter">Junospace</h1>
             </div>
             <div class="bg-white p-2 rounded-2xl shadow-xl shadow-slate-200/40 border border-slate-100 flex items-center px-6">
                <span class="material-symbols-outlined text-slate-400 text-sm mr-3">filter_list</span>
                <select class="bg-transparent border-none focus:ring-0 text-[10px] font-black uppercase tracking-widest text-slate-600 cursor-pointer">
                    <option>All Departments</option>
                    <option>Technology</option>
                    <option>Design</option>
                </select>
             </div>
        </div>
    </header>

    <!-- CORE STATS -->
    <section id="courses-stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        <!-- Injected by JS -->
        <div class="col-span-full py-10 animate-pulse bg-white/50 rounded-[2.5rem] border-2 border-dashed border-slate-100 flex items-center justify-center">
            <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Compiling Analytics...</span>
        </div>
    </section>

    <!-- COURSE LIST -->
    <section id="courses-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10">
        <!-- Injected by JS -->
    </section>

</main>

<script src="env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase
  const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)
  window.db = db
</script>
<script src="js/auth.js"></script>
<script src="js/courses.js"></script>

</body>
</html>
