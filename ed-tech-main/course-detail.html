<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; font-weight: 300; }
        h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
        
        /* Premium Dark Mode Overrides */
        .dark body { background-color: #000000; color: #ffffff; }
        .dark .bg-white { background-color: #0a0a0a !important; }
        .dark .text-slate-800, .dark .text-slate-700, .dark .text-slate-900 { color: #ffffff !important; }
        .dark .text-slate-600, .dark .text-slate-500 { color: #cbd5e1 !important; }
        .dark .text-slate-400 { color: #94a3b8 !important; }
        .dark .border-slate-100, .dark .border-violet-100 { border-color: rgba(139, 92, 246, 0.2) !important; }
        .dark .border-violet-300 { border-color: rgba(139, 92, 246, 0.4) !important; }
        .dark .bg-slate-50 { background-color: #000000 !important; }
        .dark .bg-violet-50 { background-color: #1e1b4b !important; }
        .dark .shadow-sm, .dark .shadow-xl { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important; }
    </style>
    <script>
        function applyTheme() {
            const theme = localStorage.getItem('junospace-theme') || 'light';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        }
        window.addEventListener('storage', applyTheme);
        window.addEventListener('message', (e) => {
            if (e.data.action === 'themeUpdate') applyTheme();
        });
        applyTheme();
    </script>
<style>
        .editorial-gap { gap: 1.5rem; }
    </style>
</head>
<script>/* In-frame sidebar suppression */
(function(){
  if(window.self!==window.top){
    document.documentElement.classList.add('in-frame');
    // inject override styles immediately
    var s=document.createElement('style');
    s.textContent='html.in-frame aside,html.in-frame [class*="w-64"][class*="fixed"],html.in-frame [class*="w-72"][class*="fixed"]{display:none!important;}html.in-frame main,[class*="ml-64"],[class*="ml-72"]{margin-left:0!important;}html.in-frame header,html.in-frame .fixed.top-0{display:none!important;}html.in-frame [class*="md:pl-"]{padding-left:1.5rem!important;}html.in-frame [class*="md:ml-"]{margin-left:0!important;}html.in-frame nav.fixed.bottom-0, html.in-frame button.fixed.bottom-8, html.in-frame nav.md\\:hidden{display:none!important;}html.in-frame [class*="pt-"]{padding-top:1.5rem!important;}';
    document.head.appendChild(s);
  }
})();
</script>
<body class="bg-slate-50 text-slate-800">
<!-- SideNavBar Component -->
<aside class="h-screen w-64 fixed left-0 top-0 border-r-0 bg-slate-50 flex flex-col py-8 z-50">
<div class="px-6 mb-10">
<h1 class="text-xl font-extrabold text-violet-700 tracking-tight">Junospace</h1>
<p class="text-[11px] uppercase tracking-widest text-slate-500 mt-1">Graduate Program</p>
</div>
<nav class="flex-1 px-4 space-y-1">
<a class="flex items-center px-4 py-3 rounded-lg text-slate-500 hover:bg-violet-50 hover:text-violet-600 transition-colors group cursor-pointer" href="dashboard.html">
<span class="material-symbols-outlined mr-3">dashboard</span>
<span class="text-sm font-medium">Dashboard</span>
</a>
<a class="flex items-center px-4 py-3 rounded-lg text-violet-700 font-bold border-r-4 border-violet-700 bg-violet-50/50" href="#" onclick="return false;">
<span class="material-symbols-outlined mr-3">school</span>
<span class="text-sm font-medium">My Courses</span>
</a>
<a class="flex items-center px-4 py-3 rounded-lg text-slate-500 hover:bg-violet-50 hover:text-violet-600 transition-colors group cursor-pointer" href="leaderboard.html">
<span class="material-symbols-outlined mr-3">lightbulb</span>
<span class="text-sm font-medium">Innovation Board</span>
</a>
<a class="flex items-center px-4 py-3 rounded-lg text-slate-500 hover:bg-violet-50 hover:text-violet-600 transition-colors group cursor-pointer" href="analytics.html">
<span class="material-symbols-outlined mr-3">analytics</span>
<span class="text-sm font-medium">Analytics</span>
</a>
<a class="flex items-center px-4 py-3 rounded-lg text-slate-500 hover:bg-violet-50 hover:text-violet-600 transition-colors group cursor-pointer" href="profile.html">
<span class="material-symbols-outlined mr-3">person</span>
<span class="text-sm font-medium">Profile</span>
</a>
</nav>
<div class="px-4 mt-auto">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white py-3 rounded-full text-sm font-bold shadow-lg shadow-blue-200 hover:opacity-90 transition-all">
                Upgrade Plan
            </button>
</div>
</aside>
<!-- TopAppBar Component -->
<header class="fixed top-0 right-0 w-[calc(100%-16rem)] h-16 bg-white/80 backdrop-blur-xl z-40 flex justify-between items-center px-8 border-b border-violet-300 shadow-sm shadow-violet-100/15 shadow-sm ml-64 in-frame-header">
<style>.in-frame .in-frame-header{left:0!important;width:100%!important;margin-left:0!important;right:0!important;}</style>
<div class="flex items-center space-x-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
<input class="pl-10 pr-4 py-2 bg-slate-50 border-none rounded-full text-sm focus:ring-2 focus:ring-primary/20 w-64 transition-all" placeholder="Search lessons, files..." type="text"/>
</div>
</div>
<div class="flex items-center space-x-6">
<div class="flex items-center space-x-6">
    <!-- Clean Internal Header (Navigation handled by Parent) -->
</div>
</div>
</header>
<!-- Main Content Stage -->
<main class="ml-64 pt-16 min-h-screen bg-slate-50 pb-20 in-frame-main">
<style>.in-frame .in-frame-main{margin-left:0!important;}</style>
<!-- Course Header Section -->
<section class="px-10 py-12 flex flex-col lg:flex-row editorial-gap items-start">
<div class="flex-1 space-y-6" id="cd-header">
    <!-- Injected by JS -->
</div>
</section>
<!-- Tabs Navigation -->
<section class="px-10 border-b border-violet-100">
<div class="flex space-x-10" id="cd-tabs-nav">
<button class="pb-4 border-b-2 border-violet-600 text-violet-600 font-bold text-sm tracking-wide tab-btn" data-tab="live">Live Classes</button>
<button class="pb-4 border-b-2 border-transparent text-slate-500 hover:text-violet-600 font-semibold text-sm tracking-wide transition-all tab-btn" data-tab="assignments">Assignments</button>
<button class="pb-4 border-b-2 border-transparent text-slate-500 hover:text-violet-600 font-semibold text-sm tracking-wide transition-all tab-btn" data-tab="materials">Materials</button>
<button class="pb-4 border-b-2 border-transparent text-slate-500 hover:text-violet-600 font-semibold text-sm tracking-wide transition-all tab-btn" data-tab="assessments">Assessments</button>
<button class="pb-4 border-b-2 border-transparent text-slate-500 hover:text-violet-600 font-semibold text-sm tracking-wide transition-all tab-btn" data-tab="roadmap">AI Roadmap</button>
</div>
</section>
<!-- Tab Content -->
<section class="px-10 py-10">
    <div id="tab-live" class="tab-pane">
        <!-- Injected by JS -->
    </div>
    <div id="tab-assignments" class="tab-pane hidden">
        <!-- Injected by JS -->
    </div>
    <div id="tab-materials" class="tab-pane hidden">
        <!-- Injected by JS -->
    </div>
    <div id="tab-assessments" class="tab-pane hidden">
        <!-- Injected by JS -->
    </div>
    <div id="tab-roadmap" class="tab-pane hidden">
        <!-- Injected by JS -->
    </div>
</section>
</main>

<script src="env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase
  const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)
  window.db = db
</script>
<script src="js/auth.js"></script>
<script src="js/course-detail.js"></script>
</body></html>
