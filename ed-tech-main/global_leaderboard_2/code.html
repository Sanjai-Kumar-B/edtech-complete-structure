<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Junospace - Innovation Board</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body { font-family: 'Inter', sans-serif; font-weight: 400; overflow-x: hidden; }
    h1, h2, h3, h4, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Theme Support */
    .dark body { background-color: #020617; color: #f8fafc; }
    .dark .bg-white { background-color: #0f172a !important; border-color: rgba(255,255,255,0.05) !important; }
    .dark .text-slate-800 { color: #f1f5f9 !important; }
    .dark .text-slate-500 { color: #94a3b8 !important; }
    .dark .bg-slate-50 { background-color: #020617 !important; }

    /* Podium Animations */
    @keyframes float-podium {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }
    .animate-podium { animation: float-podium 6s ease-in-out infinite; }

    .rank-card {
        opacity: 0;
        transform: translateX(-20px);
        animation: slide-in 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes slide-in {
        to { opacity: 1; transform: translateX(0); }
    }
</style>

<script>
    function applyTheme() {
        const theme = localStorage.getItem('junospace-theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
    }
    window.addEventListener('storage', applyTheme);
    window.addEventListener('message', (e) => { if (e.data.action === 'themeUpdate') applyTheme(); });
    applyTheme();
</script>
</head>

<body class="bg-slate-50 text-slate-800 selection:bg-violet-200">

<main class="min-h-screen p-8 lg:p-12 space-y-12 max-w-[1600px] mx-auto">
    
    <!-- HEADER SECTION -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-8">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight leading-none">Innovation Board</h2>
            <p class="text-slate-500 font-medium mt-3">Recognizing the elite minds and consistent builders of Junospace.</p>
        </div>
        
        <div class="flex items-center gap-4 bg-white p-2 rounded-[2rem] shadow-xl shadow-slate-200/40 border border-slate-100">
            <select id="course-filter" class="bg-transparent border-none focus:ring-0 text-[10px] font-black uppercase tracking-widest text-slate-600 px-6 cursor-pointer">
                <option value="all">Global Rankings</option>
            </select>
            <div class="flex bg-slate-50 rounded-2xl p-1 gap-1">
                <button onclick="filterDuration('overall', this)" class="duration-tab px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all bg-white shadow-sm text-violet-600">Overall</button>
                <button onclick="filterDuration('weekly', this)" class="duration-tab px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-slate-500 hover:text-violet-600">Weekly Pulse</button>
            </div>
        </div>
    </header>

    <!-- PODIUM (Top 3 Scholars) -->
    <section id="leaderboard-podium" class="grid grid-cols-12 gap-8 h-auto lg:h-[500px] items-end px-4">
        <!-- Injected by JS -->
        <div class="col-span-12 py-20 text-center animate-pulse">
            <p class="text-xs font-black uppercase tracking-[0.3em] text-slate-300">Synchronizing Elite Personnel...</p>
        </div>
    </section>

    <!-- USER PERSONAL STANDING -->
    <section id="leaderboard-me" class="bg-slate-900 rounded-[3rem] p-10 text-white flex flex-col md:flex-row items-center justify-between gap-8 shadow-2xl shadow-slate-900/40 relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-violet-600/20 to-transparent pointer-events-none"></div>
        <!-- Injected by JS -->
    </section>

    <!-- GLOBAL STANDINGS (Rank 4+) -->
    <section class="space-y-8">
        <div class="flex items-center justify-between border-b border-slate-100 pb-6 px-4">
            <h3 class="text-xl font-black text-slate-800">Operational Standings</h3>
            <div class="flex items-center gap-3">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Real-time Performance Updates</span>
            </div>
        </div>

        <div id="leaderboard-list" class="grid grid-cols-1 gap-4">
            <!-- Injected by JS -->
        </div>

        <div class="pt-8 flex justify-center">
            <button class="px-10 py-5 bg-white border border-slate-200 rounded-[2rem] text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-800 hover:border-slate-400 transition-all shadow-sm">Initialize Full Personnel Fetch</button>
        </div>
    </section>

</main>

<script src="../env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase
  const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)
  window.db = db
</script>
<script src="../js/auth.js"></script>
<script src="../js/leaderboard.js"></script>

</body>
</html>
