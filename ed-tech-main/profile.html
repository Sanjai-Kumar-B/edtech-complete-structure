<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Junospace - Profile</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark body { background-color: #000000; color: #ffffff; }
        .dark .bg-white { background-color: #0a0a0a !important; }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(139, 92, 246, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <script>/* In-frame sidebar suppression */
    (function(){
      if(window.self!==window.top){
        document.documentElement.classList.add('in-frame');
        var s=document.createElement('style');
        s.textContent='html.in-frame aside,html.in-frame header{display:none!important;}html.in-frame main{margin-left:0!important;padding-top:2rem!important;}';
        document.head.appendChild(s);
      }
    })();
    </script>

    <aside class="fixed left-0 top-0 h-screen w-72 bg-white border-r border-slate-100 py-8 px-6 hidden md:flex flex-col">
        <div class="mb-12">
            <h1 class="text-2xl font-black text-violet-600">Junospace</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 p-3 text-slate-500 hover:bg-slate-50 rounded-xl transition-all">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="font-bold text-sm">Dashboard</span>
            </a>
            <a href="courses.html" class="flex items-center gap-3 p-3 text-slate-500 hover:bg-slate-50 rounded-xl transition-all">
                <span class="material-symbols-outlined">school</span>
                <span class="font-bold text-sm">My Courses</span>
            </a>
            <a href="leaderboard.html" class="flex items-center gap-3 p-3 text-slate-500 hover:bg-slate-50 rounded-xl transition-all">
                <span class="material-symbols-outlined">leaderboard</span>
                <span class="font-bold text-sm">Leaderboard</span>
            </a>
            <a href="profile.html" class="flex items-center gap-3 p-3 bg-violet-50 text-violet-600 rounded-xl transition-all">
                <span class="material-symbols-outlined">person</span>
                <span class="font-bold text-sm">Profile</span>
            </a>
        </nav>
    </aside>

    <main class="md:ml-72 p-8 max-w-4xl">
        <h2 class="text-3xl font-black text-slate-800 mb-8">Account Settings</h2>
        
        <div class="space-y-8">
            <!-- Profile Section -->
            <section class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-sm">
                <div class="flex items-center gap-8 mb-10">
                    <div class="relative">
                        <img id="profile-avatar" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-xl" alt="Avatar"/>
                        <button onclick="document.getElementById('avatar-input').focus()" class="absolute bottom-0 right-0 bg-violet-600 text-white p-2 rounded-full shadow-lg">
                            <span class="material-symbols-outlined text-sm">edit</span>
                        </button>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black text-slate-800" id="display-name">Loading...</h3>
                        <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-1" id="display-role">Student</p>
                    </div>
                </div>

                <form id="profile-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Full Name</label>
                        <input type="text" id="name-input" readonly class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-500 cursor-not-allowed" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
                        <input type="email" id="email-input" readonly class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-500 cursor-not-allowed" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Avatar URL</label>
                        <input type="text" id="avatar-input" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-violet-500/20" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Phone Number</label>
                        <input type="text" id="phone-input" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-violet-500/20" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Rank Level</label>
                        <input type="text" id="level-input" readonly class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-500" />
                    </div>
                    <div class="md:col-span-2 pt-4">
                        <button type="submit" id="save-btn" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-violet-600 transition-all shadow-xl shadow-slate-200">Save Profile</button>
                    </div>
                </form>
            </section>

            <!-- Password Section -->
            <section class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-sm">
                <h3 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">
                    <span class="material-symbols-outlined text-violet-600">lock</span> Security
                </h3>
                
                <div id="password-verify-step">
                    <p class="text-sm text-slate-500 mb-6">Enter your current password to change it.</p>
                    <div class="flex gap-4">
                        <input type="password" id="current-password" placeholder="Current Password" class="flex-1 bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-violet-500/20" />
                        <button onclick="verifyCurrentPassword()" class="bg-violet-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-violet-700 transition-all">Verify</button>
                    </div>
                </div>

                <div id="password-change-step" class="hidden space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">New Password</label>
                            <input type="password" id="new-password" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-violet-500/20" />
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Confirm Password</label>
                            <input type="password" id="confirm-password" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-violet-500/20" />
                        </div>
                    </div>
                    <button onclick="updatePassword()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-violet-600 transition-all">Update Password</button>
                </div>
            </section>
        </div>
    </main>

    <script src="env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase
      const db = createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY)
      window.db = db
    </script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
